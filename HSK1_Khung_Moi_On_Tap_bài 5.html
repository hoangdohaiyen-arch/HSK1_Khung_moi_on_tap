<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HSK1 Khung mới – Ôn tập | Tiếng Trung Cô Yến</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#c23320;--bg:#faf6ee;--card:#fff;--ink:#2b2622;--mut:#8a8173;--ln:#e6dcc9;--ok:#4f7f60;--okb:#e3eee6;--no:#7d5370;--nob:#f0e6ee;--g:#4e8a63;--gb:#e7f0e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1c19;--card:#2a2623;--ink:#f1ebe0;--mut:#a89f90;--ln:#3d3730;--okb:#25392c;--nob:#3a2c37;--ok:#8fc2a0;--no:#d3a7c6}}
:root[data-theme=dark]{--bg:#1f1c19;--card:#2a2623;--ink:#f1ebe0;--mut:#a89f90;--ln:#3d3730;--okb:#25392c;--nob:#3a2c37;--ok:#8fc2a0;--no:#d3a7c6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 'Be Vietnam Pro',sans-serif}
.hz{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.app{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--card);border-right:1px solid var(--ln);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.ls{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13.5px}
.ls:hover{background:var(--bg)}.ls.on{border-left-color:var(--c);background:var(--bg);font-weight:700}.ls small{color:var(--mut);display:block;font-weight:400}
main{flex:1;min-width:0;padding:16px 22px 40px;max-width:980px}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:18px;padding-bottom:0}
.tb{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap}
.tb.on{color:var(--ink);font-weight:700;border-bottom-color:var(--c)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.btn{background:var(--c);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.btn.o{background:none;color:var(--c);border:1.5px solid var(--c)}
.sp{background:none;border:1px solid var(--ln);border-radius:8px;cursor:pointer;padding:3px 8px;color:var(--ink)}
.badge{display:inline-block;border:1.5px solid var(--c);color:var(--c);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.home{text-align:center;padding:30px 10px}.brand{font-weight:700;letter-spacing:.04em;color:var(--c);font-size:15px}
.big{font-size:54px;font-weight:700;margin:14px 0 2px}.py{color:var(--mut);font-size:18px}.vi{font-size:20px;font-weight:600;margin-bottom:18px}
.goal{text-align:left;max-width:520px;margin:18px auto 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--ln);padding:8px 6px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut);text-transform:uppercase}td.h{font-size:22px;font-weight:700}
.wrap{overflow-x:auto}
.fc{perspective:900px;max-width:420px;margin:10px auto;height:250px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.f .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:2px solid var(--c);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
.fs.b{transform:rotateY(180deg)}.fs .big{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.grid .fc{height:120px;margin:0}.grid .big{font-size:26px}.grid .fs{padding:6px;font-size:12.5px}.grid .fs .py{font-size:13px}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.q{font-weight:600;margin-bottom:8px}.opts{display:flex;gap:8px;flex-wrap:wrap}
.op{background:var(--bg);border:1.5px solid var(--ln);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;color:var(--ink)}.op:hover{border-color:var(--c)}
.op.ok,.fb.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.op.no,.fb.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{margin-top:8px;font-size:13.5px;min-height:1px;border-radius:6px;padding:0}.fb.ok,.fb.no{padding:5px 10px;border:0}
.tk{background:var(--bg);border:1.5px solid var(--ln);border-radius:8px;padding:5px 11px;cursor:pointer;color:var(--ink);font:inherit}.tk[disabled]{opacity:.3}
.ans{min-height:40px;border-bottom:2px dashed var(--ln);margin:8px 0;padding:4px;font-size:20px}
input.in{font:inherit;font-size:18px;padding:8px;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;max-width:380px}
.note{background:var(--bg);border-left:3px solid var(--c);padding:8px 12px;border-radius:6px;font-size:13.5px;margin:10px 0}
.ex{background:var(--bg);border-radius:8px;padding:8px 12px;margin:6px 0}.ex b{font-size:18px}
h3{margin:4px 0 10px}h2{margin:0 0 8px}.sc{float:right;font-weight:700;color:var(--c)}
.cv{border:1.5px solid var(--ln);border-radius:10px;background:var(--card);touch-action:none;max-width:100%}
.hl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.hl button{font-size:22px;min-width:44px}
.hl button.on{border-color:var(--c);color:var(--c);font-weight:700}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#8fc2a0;--gb:#25392c}}:root[data-theme=dark]{--g:#8fc2a0;--gb:#25392c}
aside{border-top:4px solid var(--g)}aside h4{color:var(--g)}.ls.on{border-left-color:var(--g);background:var(--gb)}
.note{border-left-color:var(--g);background:var(--gb)}th{color:var(--g)}h3{color:var(--g)}.sp:hover{border-color:var(--g)}
.home{background:linear-gradient(180deg,var(--gb),var(--card) 160px)}.fs{border-color:var(--g)}.fs.b{border-color:var(--c)}.hl button.on{border-color:var(--g);color:var(--g)}
.fimg svg{width:170px;height:auto;display:block}.fimg+.big{font-size:42px;margin-top:4px}.grid .fimg{display:none}.hero{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}.hero svg{width:150px;height:auto;border:2px solid var(--g);border-radius:12px}.ph{border:2px dashed var(--ln);border-radius:12px;padding:20px;color:var(--mut);font-size:13.5px}
.hd{font-size:24px;font-weight:700;letter-spacing:.05em;color:var(--c);margin:0 0 10px;line-height:1.2}.ft{text-align:center;margin-top:26px;padding-top:12px;border-top:1px solid var(--ln);color:var(--mut);font-size:13.5px;font-weight:600}.ft a{color:var(--g);text-decoration:none}
@media(max-width:760px){.app{display:block}aside{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln)}aside h4{display:none}.ls{width:auto;white-space:nowrap}.ls small{display:none}main{padding:12px}}

if(x.t=='s')h+=`<div class="ans hz" id="a${k}"></div><div class="opts">${shuf(x.tk).map(t=>`<button class="tk hz" data-tk="${t}">${t}</button>`).join('')}</div><div class="ctl" style="justify-content:flex-start"><button class="btn" data-chk="${k}">Kiểm tra</button><button class="btn o" data-clr="${k}">Xoá</button></div>`;
else if(x.t=='i')h+=`<input class="in hz" id="i${k}" placeholder="Gõ chữ Hán…"> <button class="btn" data-chk="${k}">Kiểm tra</button>`;
else h+=`<div class="opts">${x.o.map((o,j)=>`<button class="op hz" data-j="${j}">${o}</button>`).join('')}</div>`;
h+='<div class="fb"></div></div>'});
$('#view').innerHTML=h;const V=$('#view');V.onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.closest('.card');if(!c)return;const k=+c.dataset.k,x=items[k];
if(b.dataset.say)return say(b.dataset.say);if(c.dataset.d)return;
if(b.dataset.j!=null){const ok=+b.dataset.j==x.a;b.classList.add(ok?'ok':'no');fin(c,ok,x.o[x.a])}
else if(b.dataset.tk){$('#a'+k).textContent+=b.dataset.tk;b.disabled=true}
else if(b.dataset.clr!=null){$('#a'+k).textContent='';c.querySelectorAll('.tk').forEach(t=>t.disabled=false)}
else if(b.dataset.chk!=null){const n=s=>s.replace(/[。，！？、,.!?\s]/g,'');if(x.t=='s'){const g=n($('#a'+k).textContent);fin(c,g==x.a,x.a)}else{const g=n($('#i'+k).value);fin(c,x.a.map(n).includes(g),x.a[0])}}};
function fin(c,ok,a){c.dataset.d=1;const f=c.querySelector('.fb');f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✓ Chính xác':'✗ Đáp án: '+a;c.dataset.s=ok?1:0;const s=[...V.querySelectorAll('.card[data-s="1"]')].length;$('#sc').textContent=s+'/'+items.length}}
/* ===== RENDER ===== */
function render(){side();tabs();const V=$('#view');V.onclick=null;const ft=$('#ft');if(ft)ft.style.display=tab=='home'?'none':'block';
if(cur!=5&&tab!='home'){V.innerHTML=pend();return}
const l=L[cur-1];
if(tab=='home'){V.innerHTML=`<div class="home card"><div><span class="badge" style="border-color:var(--g);color:var(--g)">Học liệu độc quyền</span></div><a id="zalo" class="btn o" style="display:inline-block;margin-top:8px;text-decoration:none" href="https://zalo.me/0916055988" target="_blank" rel="noopener">Zalo 0916055988</a>${hero(cur)}<div class="badge" style="margin-top:14px">Bài ${cur}</div><div class="big hz">${l[1]}</div><div class="py">${l[2]}</div><div class="vi">${l[3]}</div>${cur==5?`<div class="goal"><b>Mục tiêu bài học</b><ul><li>Đọc, hiểu và dùng 22 từ vựng mới của bài.</li><li>Hỏi và nói ngày, thứ: 今天几号？今天9月8号。星期几？星期日。</li><li>Dùng câu vị ngữ danh từ không cần 是.</li><li>Dùng 会 để nói về kỹ năng: 我会做饭。</li></ul></div>`:'<p style="color:var(--mut)">Mục tiêu bài học: đang soạn.</p>'}</div>`;return}
if(cur!=5){V.innerHTML=pend();return}
if(tab=='vocab'){V.innerHTML=`<div class="ctl" style="justify-content:flex-start"><button class="btn" data-say="vg:1">🔊 Nghe ①–⑧</button><button class="btn" data-say="vg:2">🔊 Nghe ⑨–⑮</button><button class="btn" data-say="vg:3">🔊 Nghe ⑯–㉒</button></div><div class="wrap"><table><tr><th>STT</th><th>Chữ Hán</th><th>Pinyin</th><th>Nghĩa</th><th>Từ loại</th><th>Cụm thường gặp</th><th></th></tr>${V5.map((v,i)=>`<tr><td>${i+1}</td><td class="h hz">${v[0]}</td><td>${v[1]}</td><td>${v[3]}</td><td>${v[2]}</td><td class="hz">${v[4]}</td><td>${sp(v[0])}</td></tr>`).join('')}</table></div><div class="note">Âm thanh 🔊 từng từ ①–⑮ là giọng trong file ghi âm của sách (5-2, 5-4); 7 từ cuối chưa tách được nên nút từng từ dùng giọng máy, hãy bấm “Nghe ⑯–㉒” để nghe file sách.</div>`;
V.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say)say(b.dataset.say);if(b.id=='all'){speechSynthesis.cancel();V5.forEach(v=>{const u=new SpeechSynthesisUtterance(v[0]);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)})}}}
else if(tab=='flash'){if(!fo.length)fo=V5.map((_,i)=>i);const c=i=>{const v=V5[fo[i]];return `<div class="fc" data-i="${i}"><div class="fi"><div class="fs"><div class="fimg">${IMG[v[0]]||''}</div><div class="big hz">${v[0]}</div></div><div class="fs b"><div class="py">${v[1]}</div><div class="vi">${v[3]}</div></div></div></div>`};
V.innerHTML=`<div class="ctl"><button class="btn o" id="sh">🔀 Xáo trộn</button><button class="btn o" id="gr">${fgrid?'Xem từng thẻ':'Lật tất cả thẻ'}</button>${fgrid?'<button class="btn" id="fa">Lật tất cả</button>':''}</div>`+(fgrid?`<div class="grid">${fo.map((_,i)=>c(i)).join('')}</div>`:`<div style="text-align:center;color:var(--mut)">${fi+1}/${fo.length} · bấm thẻ để lật</div>${c(fi)}<div class="ctl"><button class="btn o" id="pv">← Trước</button>${sp(V5[fo[fi]][0])}<button class="btn" id="nx">Sau →</button></div>`);
V.onclick=e=>{const k=e.target.closest('.fc'),b=e.target.closest('button');if(b){if(b.dataset.say)say(b.dataset.say);else{if(b.id=='sh'){fo=shuf(fo);fi=0}if(b.id=='gr')fgrid=!fgrid;if(b.id=='pv')fi=(fi+fo.length-1)%fo.length;if(b.id=='nx')fi=(fi+1)%fo.length;if(b.id=='fa'){const a=[...V.querySelectorAll('.fc')],on=a.some(x=>!x.classList.contains('f'));a.forEach(x=>x.classList.toggle('f',on));return}render()}}else if(k)k.classList.toggle('f')}}
else if(tab=='vex')quiz(VEX);
else if(tab=='gram'){V.innerHTML=`<div class="card"><h3>1. Cách nói thời gian (1) 时间的表达</h3><div class="note">Trật tự: <b class="hz">年 → 月 → 日(号) → 星期</b> (từ lớn đến nhỏ).</div><div class="ex"><b class="hz">2025年1月1日，星期三</b><br>Năm đọc từng chữ số.</div><div class="ex"><b class="hz">今天几号？— 今天9月8号。</b><br><b class="hz">星期几？— 星期日。</b> (Bài khoá 1)<br>Sách gợi ý: ngày 8 tháng 9 cũng nói <b class="hz">9月8日</b>; Chủ nhật cũng nói <b class="hz">星期天</b> (“Tiểu Ngữ giúp sức”, tr.28).</div><table><tr><th>Cấu trúc</th><th>Ví dụ</th></tr><tr><td>Tháng: số + 月</td><td class="hz">一月、十月</td></tr><tr><td>Ngày: số + 号 (khẩu ngữ) / 日 (văn viết)</td><td class="hz">五月一号 / 1月1日</td></tr><tr><td>Thứ: 星期 + 一…六 / 天 / 日</td><td class="hz">星期四、星期天、星期日</td></tr></table></div>
<div class="card"><h3>2. Câu vị ngữ danh từ 名词谓语句</h3><div class="note">Danh từ / cụm từ chỉ thời gian làm vị ngữ trực tiếp, <b>không cần 是</b>.</div><div class="ex"><b class="hz">今天星期四。</b> Hôm nay là thứ Năm.</div><div class="ex"><b class="hz">今天不是星期五。</b> Phủ định phải dùng <b>不是</b>, không nói 不星期五.</div></div>
<div class="card"><h3>3. Động từ năng nguyện 会</h3><div class="note">“会” đặt trước động từ, biểu thị việc <b>biết hoặc có khả năng thực hiện một hành động nào đó thông qua học tập</b> (theo sách tr.31). Cấu trúc: <b class="hz">S + 会 + V (+ O)</b></div><div class="ex"><b class="hz">你会做饭吗？</b> Em có biết nấu ăn không?</div><div class="ex"><b class="hz">我会做面条儿。</b> Em biết nấu mì.</div><div class="ex"><b class="hz">我会做。</b> Em biết.</div><div class="ex"><b class="hz">我不会做饺子。</b> Phủ định: <b>不会</b> + V (câu tự đặt, không có trong các trang đã gửi).</div></div>`}
else if(tab=='gex')quiz(GEX);
else if(tab=='read'){quiz(READ,PRE()+'<h3>Câu hỏi đọc hiểu</h3>')}
else if(tab=='listen'){quiz(LIS)}
else if(tab=='write'){let all=[],hd=[];WR.forEach(g=>{hd.push([all.length,g[0]]);all=all.concat(g[1])});quiz(all);hd.reverse().forEach(h=>{const c=$('#view').querySelector(`.card[data-k="${h[0]}"]`);c.insertAdjacentHTML('beforebegin',`<h3>${h[1]}</h3>`)})}
else if(tab=='han'){const h=HZ[hi];V.innerHTML=`<div class="hl">${HZ.map((z,i)=>`<button class="op hz ${i==hi?'on':''}" data-h="${i}">${z[0]}</button>`).join('')}</div><div class="card"><div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div class="big hz" style="margin:0">${h[0]}</div><div><div class="py">${h[1]} · ${h[3]} nét ${sp(h[0])}</div><div style="margin:4px 0"><span class="badge">${W.includes(h[0])?'Chữ yêu cầu viết':'Chỉ cần nhận diện'}</span></div><div class="vi" style="margin:0">${h[4]}</div><div>Bộ thủ chính: <b class="hz">${h[2]}</b></div></div></div><div class="note">💡 ${h[5]}</div></div><div style="display:flex;gap:14px;flex-wrap:wrap"><div><b>Viết theo nét mờ</b><br><canvas class="cv" id="c1" width="260" height="260"></canvas></div><div><b>Tự viết ô trắng</b><br><canvas class="cv" id="c2" width="260" height="260"></canvas></div></div><div class="ctl" style="justify-content:flex-start"><button class="btn o" id="cl">Xoá nét viết</button></div>`;
const cs=['c1','c2'].map(id=>$('#'+id));const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const base=(cv,g)=>{const x=cv.getContext('2d');x.clearRect(0,0,260,260);x.strokeStyle=dark?'#4a4238':'#e6dcc9';x.lineWidth=1;x.setLineDash([5,5]);x.strokeRect(1,1,258,258);x.beginPath();x.moveTo(130,0);x.lineTo(130,260);x.moveTo(0,130);x.lineTo(260,130);x.moveTo(0,0);x.lineTo(260,260);x.moveTo(260,0);x.lineTo(0,260);x.stroke();x.setLineDash([]);if(g){x.fillStyle=dark?'rgba(255,255,255,.16)':'rgba(0,0,0,.13)';x.font='200px "Noto Sans SC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(h[0],130,138)}};
cs.forEach((cv,i)=>{base(cv,i==0);const x=cv.getContext('2d');let d=0;const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*260/r.width,(e.clientY-r.top)*260/r.height]};cv.onpointerdown=e=>{d=1;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b);x.strokeStyle='#c23320';x.lineWidth=6;x.lineCap='round';x.lineJoin='round'};cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};cv.onpointerup=()=>d=0});
V.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say)say(b.dataset.say);else if(b.dataset.h!=null){hi=+b.dataset.h;render()}else if(b.id=='cl')cs.forEach((cv,i)=>base(cv,i==0))}}}
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]'),t=e.target.closest('[data-t]');if(l){cur=+l.dataset.l;fo=[];fi=0}if(t)tab=t.dataset.t;if(l||t)render()});
render();
</script></body></html>
